<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagrama de Classes - Sistema de Gestão Catequética</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg">
        <i class="fa-solid fa-sitemap text-lg"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-white">Sistema de Gestão Catequética</h1>
        <p class="text-xs text-slate-400">Diagrama de Classes UML (Renderização Nativa SVG / D3.js)</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-1.5 bg-slate-950/80 border border-slate-800 rounded-lg px-3 py-1.5 text-xs">
        <span class="text-slate-400 font-medium"><i class="fa-solid fa-filter text-indigo-400 mr-1"></i> Módulo:</span>
        <select id="module-filter" class="bg-transparent text-slate-200 focus:outline-none cursor-pointer">
          <option value="ALL" class="bg-slate-900">Todos os Domínios</option>
          <option value="USUARIOS" class="bg-slate-900">Usuários & Atores</option>
          <option value="MATRICULAS" class="bg-slate-900">Matrículas & Documentos</option>
          <option value="CATEQUIZANDOS" class="bg-slate-900">Catequizandos & Sacramentos</option>
          <option value="TURMAS" class="bg-slate-900">Turmas & Etapas</option>
          <option value="CONTEUDO" class="bg-slate-900">Conteúdos & Aulas</option>
          <option value="FREQUENCIA" class="bg-slate-900">Frequência & Reposições</option>
          <option value="COMUNICACAO" class="bg-slate-900">Comunicação & Eventos</option>
        </select>
      </div>

      <button id="btn-code" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
        <i class="fa-solid fa-code"></i> Código Fonte
      </button>

      <button id="btn-reset" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
        <i class="fa-solid fa-expand"></i> Centralizar
      </button>
    </div>
  </header>

  <!-- Canvas Container -->
  <main class="flex-1 relative bg-slate-950 flex items-center justify-center overflow-hidden">
    <svg id="class-diagram" class="w-full h-full cursor-grab active:cursor-grabbing"></svg>

    <!-- Floating Legend -->
    <div class="absolute bottom-4 left-4 bg-slate-900/90 border border-slate-800 backdrop-blur p-3 rounded-xl text-xs space-y-1.5 shadow-xl pointer-events-none z-10">
      <div class="font-bold text-slate-300 mb-1">Convenções UML:</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 bg-indigo-500/20 border border-indigo-500 rounded"></i></span> <span class="text-slate-400">Classe de Domínio</span></div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 bg-amber-500/20 border border-amber-500 rounded"></span> <span class="text-slate-400">Enumeração</span></div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 bg-purple-500/20 border border-purple-500 rounded"></span> <span class="text-slate-400">Classe Abstrata</span></div>
    </div>
  </main>

  <!-- Modal Code View -->
  <div id="code-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-4xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-file-code text-indigo-400 text-lg"></i>
          <h2 class="font-bold text-white text-sm">Código Fonte (PlantUML & Mermaid)</h2>
        </div>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="flex border-b border-slate-800 bg-slate-950 px-6">
        <button id="tab-plantuml" class="px-4 py-3 text-xs font-semibold text-indigo-400 border-b-2 border-indigo-500">PlantUML Original</button>
        <button id="tab-mermaid" class="px-4 py-3 text-xs font-semibold text-slate-400 hover:text-slate-200 border-b-2 border-transparent">Mermaid.js</button>
      </div>

      <div class="flex-1 p-6 overflow-y-auto custom-scrollbar relative bg-slate-950">
        <button id="btn-copy" class="absolute top-6 right-6 bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow transition">
          <i class="fa-regular fa-copy"></i> Copiar
        </button>
        <pre id="code-content" class="text-xs font-mono text-slate-300 leading-relaxed whitespace-pre"></pre>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-white px-4 py-2 rounded-xl text-xs font-medium opacity-0 pointer-events-none transition-all z-50">
    Código copiado com sucesso!
  </div>

  <script>
    // Class Data definitions with domain grouping for filters
    const classesData = [
      { id: 'Usuario', type: 'abstract', module: 'USUARIOS', x: 200, y: 50, title: 'Usuario', attributes: ['+ id: Long', '+ nome: String', '+ email: String', '+ senha: String', '+ telefone: String', '+ ativo: Boolean', '+ dataCadastro: DateTime'] },
      { id: 'Responsavel', type: 'class', module: 'USUARIOS', x: 0, y: 320, title: 'Responsavel', attributes: ['+ cpf: String', '+ parentesco: String'] },
      { id: 'Catequista', type: 'class', module: 'USUARIOS', x: 220, y: 320, title: 'Catequista', attributes: ['+ formacao: String', '+ dataIngresso: Date'] },
      { id: 'Coordenador', type: 'class', module: 'USUARIOS', x: 120, y: 520, title: 'Coordenador', attributes: [] },
      { id: 'Secretaria', type: 'class', module: 'USUARIOS', x: 380, y: 320, title: 'Secretaria', attributes: [] },

      { id: 'Matricula', type: 'class', module: 'MATRICULAS', x: 650, y: 50, title: 'Matricula', attributes: ['+ id: Long', '+ dataSolicitacao: Date', '+ status: StatusMatricula', '+ observacao: String'] },
      { id: 'StatusMatricula', type: 'enum', module: 'MATRICULAS', x: 950, y: 50, title: 'StatusMatricula', attributes: ['ENVIADA', 'EM_ANALISE', 'PENDENCIA', 'APROVADA', 'REJEITADA'] },
      { id: 'Documento', type: 'class', module: 'MATRICULAS', x: 650, y: 300, title: 'Documento', attributes: ['+ id: Long', '+ nomeArquivo: String', '+ tipoDocumento: String', '+ dataEnvio: Date', '+ status: StatusDocumento', '+ parecer: String'] },
      { id: 'StatusDocumento', type: 'enum', module: 'MATRICULAS', x: 950, y: 320, title: 'StatusDocumento', attributes: ['PENDENTE', 'APROVADO', 'REJEITADO'] },

      { id: 'Catequizando', type: 'class', module: 'CATEQUIZANDOS', x: 650, y: 520, title: 'Catequizando', attributes: ['+ id: Long', '+ nome: String', '+ dataNascimento: Date', '+ sexo: String', '+ endereco: String', '+ telefoneEmergencia: String', '+ situacao: String', '+ dataIngresso: Date'] },
      { id: 'Sacramento', type: 'class', module: 'CATEQUIZANDOS', x: 950, y: 520, title: 'Sacramento', attributes: ['+ id: Long', '+ tipo: TipoSacramento', '+ dataRecebimento: Date', '+ paroquia: String', '+ comprovante: String'] },
      { id: 'TipoSacramento', type: 'enum', module: 'CATEQUIZANDOS', x: 1220, y: 520, title: 'TipoSacramento', attributes: ['BATISMO', 'EUCARISTIA', 'CRISMA'] },

      { id: 'EtapaCatequetica', type: 'class', module: 'TURMAS', x: 200, y: 750, title: 'EtapaCatequetica', attributes: ['+ id: Long', '+ nome: String', '+ descricao: String', '+ ordem: Integer', '+ ativa: Boolean'] },
      { id: 'Turma', type: 'class', module: 'TURMAS', x: 650, y: 750, title: 'Turma', attributes: ['+ id: Long', '+ nome: String', '+ ano: Integer', '+ horario: String', '+ local: String', '+ ativa: Boolean'] },

      { id: 'EncontroCatequetico', type: 'class', module: 'CONTEUDO', x: 1050, y: 750, title: 'EncontroCatequetico', attributes: ['+ id: Long', '+ data: Date', '+ tema: String', '+ observacoes: String'] },
      {
 id: 'ConteudoCatequetico',
 type: 'class',
 module: 'CONTEUDO',
 x: 1400,
 y: 750,
 title: 'ConteudoCatequetico',
 attributes: [
   '+ id: Long',
   '+ titulo: String',
   '+ descricao: String',
   '+ dataCriacao: Date'
 ]
}, {
 id: 'DisponibilizacaoConteudo',
 type: 'class',
 module: 'CONTEUDO',
 x: 1400,
 y: 350,
 title: 'DisponibilizacaoConteudo',
 attributes: [
   '+ id: Long',
   '+ dataDisponibilizacao: Date',
   '+ ativo: Boolean',
   '+ observacao: String'
 ]
},
      { id: 'MaterialApoio', type: 'class', module: 'CONTEUDO', x: 1400, y: 50, title: 'MaterialApoio', attributes: ['+ id: Long', '+ titulo: String', '+ categoria: String', '+ arquivo: String'] },

      { id: 'Frequencia', type: 'class', module: 'FREQUENCIA', x: 1050, y: 1050, title: 'Frequencia', attributes: ['+ id: Long', '+ status: StatusFrequencia', '+ dataRegistro: Date'] },
      { id: 'StatusFrequencia', type: 'enum', module: 'FREQUENCIA', x: 1350, y: 1050, title: 'StatusFrequencia', attributes: ['PRESENTE', 'AUSENTE', 'JUSTIFICADA', 'REPOSTA'] },
      { id: 'Justificativa', type: 'class', module: 'FREQUENCIA', x: 700, y: 1050, title: 'Justificativa', attributes: ['+ id: Long', '+ motivo: String', '+ status: StatusJustificativa', '+ dataEnvio: Date', '+ analise: String'] },
      { id: 'Reposicao', type: 'class', module: 'FREQUENCIA', x: 350, y: 1050, title: 'Reposicao', attributes: ['+ id: Long', '+ data: Date', '+ local: String', '+ observacao: String'] },
      {
 id: 'StatusJustificativa',
 type: 'enum',
 module: 'FREQUENCIA',
 x: 1350,
 y: 1220,
 title: 'StatusJustificativa',
 attributes: [
   'PENDENTE',
   'APROVADA',
   'REJEITADA'
 ]
},
      { id: 'Mensagem', type: 'class', module: 'COMUNICACAO', x: 0, y: 750, title: 'Mensagem', attributes: ['+ id: Long', '+ texto: String', '+ dataEnvio: DateTime', '+ lida: Boolean'] },
      { id: 'Comunicado', type: 'class', module: 'COMUNICACAO', x: 0, y: 950, title: 'Comunicado', attributes: ['+ id: Long', '+ titulo: String', '+ conteudo: String', '+ dataPublicacao: Date'] },
      {
 id: 'Evento',
 type: 'class',
 module: 'COMUNICACAO',
 x: 0,
 y: 1150,
 title: 'Evento',
 attributes: [
   '+ id: Long',
   '+ titulo: String',
   '+ descricao: String',
   '+ dataEvento: Date',
   '+ local: String',
   '+ obrigatorio: Boolean'
 ]
}
    ];

    const linksData = [
      { source: 'Responsavel', target: 'Usuario', type: 'inheritance' },
      { source: 'Catequista', target: 'Usuario', type: 'inheritance' },
      { source: 'Secretaria', target: 'Usuario', type: 'inheritance' },
      { source: 'Coordenador', target: 'Catequista', type: 'inheritance' },
      { source: 'Matricula', target: 'Documento', label: '1 -- 0..*' },
      {
 source: 'Responsavel',
 target: 'Catequizando',
 label: '1 -- 1..*'
}, {
 source: 'Matricula',
 target: 'Turma',
 label: '0..1'
} ,
      { source: 'Matricula', target: 'Catequizando', label: '1 -- 1' },
      { source: 'EtapaCatequetica', target: 'Turma', label: '1 -- 0..*' },
      { source: 'Catequista', target: 'Turma', label: '1 -- 0..*' },
      { source: 'Turma', target: 'Catequizando', label: '1 -- 0..*' },
      { source: 'Turma', target: 'EncontroCatequetico', label: '1 -- 0..*' },
      { source: 'EncontroCatequetico', target: 'ConteudoCatequetico', label: '* -- 1' },
      { source: 'EtapaCatequetica', target: 'ConteudoCatequetico', label: '* -- *' },
      { source: 'ConteudoCatequetico', target: 'DisponibilizacaoConteudo', label: '1 -- 0..*' },
      { source: 'Catequista', target: 'DisponibilizacaoConteudo', label: '1 -- 0..*' },
      { source: 'Coordenador', target: 'DisponibilizacaoConteudo', label: '1 -- 0..*' },
      { source: 'ConteudoCatequetico', target: 'MaterialApoio', label: '1 -- 0..*' },
      { source: 'Catequizando', target: 'Frequencia', label: '1 -- 0..*' },
      { source: 'EncontroCatequetico', target: 'Frequencia', label: '1 -- 0..*' },
      { source: 'Catequizando', target: 'Justificativa', label: '1 -- 0..*' },
      { source: 'Justificativa', target: 'Frequencia', label: '1 -- 1' },
      { source: 'Catequizando', target: 'Reposicao', label: '* -- *' },
      { source: 'Responsavel', target: 'Mensagem', label: '1 -- 0..*' },
      { source: 'Catequista', target: 'Mensagem', label: '1 -- 0..*' },
      { source: 'Coordenador', target: 'Comunicado', label: '1 -- 0..*' },
      { source: 'Catequizando', target: 'Evento', label: '* -- *' },
      { source: 'Catequizando', target: 'Sacramento', label: '1 -- 0..*' }, {
 source: 'Sacramento',
 target: 'TipoSacramento',
 label: '* --> 1'
}, {
 source: 'Matricula',
 target: 'StatusMatricula',
 label: '* --> 1'
} ,{
 source: 'Documento',
 target: 'StatusDocumento',
 label: '* --> 1'
}, {
 source: 'Frequencia',
 target: 'StatusFrequencia',
 label: '* --> 1'
}, {
 source: 'Justificativa',
 target: 'StatusJustificativa',
 label: '* --> 1'
}
    ];

    const plantUmlSource = `@startuml SistemaGestaoCatequetica
skinparam classAttributeIconSize 0
skinparam linetype ortho
abstract class Usuario {
    +id: Long
    +nome: String
    +email: String
    +senha: String
    +telefone: String
    +ativo: Boolean
    +dataCadastro: DateTime
}
class Responsavel {
    +cpf: String
    +parentesco: String
}
class Catequista {
    +formacao: String
    +dataIngresso: Date
}
class Coordenador
class Secretaria
Usuario <|-- Responsavel
Usuario <|-- Catequista
Usuario <|-- Secretaria
Catequista <|-- Coordenador
@enduml`;

    const mermaidSource = `classDiagram
direction BT
class Usuario {
    +Long id
    +String nome
    +String email
}
Usuario <|-- Responsavel
Usuario <|-- Catequista`;

    // Render D3 SVG Diagram
    const svg = d3.select("#class-diagram");
    const container = svg.append("g");

    const zoom = d3.zoom()
      .scaleExtent([0.1, 4])
      .on("zoom", (event) => {
        container.attr("transform", event.transform);
      });

    svg.call(zoom);

    function render(filterModule = 'ALL') {
      container.selectAll("*").remove();

      const filteredClasses = filterModule === 'ALL' 
        ? classesData 
        : classesData.filter(d => d.module === filterModule);

      const activeIds = new Set(filteredClasses.map(d => d.id));

      const filteredLinks = linksData.filter(l => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        return activeIds.has(s) && activeIds.has(t);
      });

      const classMap = new Map(classesData.map(d => [d.id, d]));

      // Draw links
      const linkGroup = container.append("g");
      filteredLinks.forEach(link => {
        const source = classMap.get(typeof link.source === 'object' ? link.source.id : link.source);
        const target = classMap.get(typeof link.target === 'object' ? link.target.id : link.target);
        if (!source || !target) return;

        const x1 = source.x + 90, y1 = source.y + 45;
        const x2 = target.x + 90, y2 = target.y + 45;

        if (link.type === 'inheritance') {
          linkGroup.append("line")
            .attr("x1", x1).attr("y1", y1)
            .attr("x2", x2).attr("y2", y2)
            .attr("stroke", "#6366f1")
            .attr("stroke-width", 2)
            .attr("stroke-dasharray", "4");
        } else {
          linkGroup.append("line")
            .attr("x1", x1).attr("y1", y1)
            .attr("x2", x2).attr("y2", y2)
            .attr("stroke", "#475569")
            .attr("stroke-width", 1.5);

          if (link.label) {
            linkGroup.append("text")
              .attr("x", (x1 + x2) / 2)
              .attr("y", (y1 + y2) / 2 - 6)
              .attr("fill", "#94a3b8")
              .attr("font-size", "10px")
              .attr("text-anchor", "middle")
              .text(link.label);
          }
        }
      });

      // Draw classes
      const nodeGroup = container.append("g");
      filteredClasses.forEach(cls => {
        const g = nodeGroup.append("g")
          .attr("transform", `translate(${cls.x}, ${cls.y})`);

        const headerHeight = 30;
        const bodyHeight = Math.max(40, cls.attributes.length * 18 + 10);
        const totalHeight = headerHeight + bodyHeight;

        // Box background
        g.append("rect")
          .attr("width", 180)
          .attr("height", totalHeight)
          .attr("rx", 8)
          .attr("fill", cls.type === 'enum' ? '#1e1b4b' : (cls.type === 'abstract' ? '#3b0764' : '#0f172a'))
          .attr("stroke", cls.type === 'enum' ? '#6366f1' : (cls.type === 'abstract' ? '#a855f7' : '#334155'))
          .attr("stroke-width", 1.5);

        // Header
        g.append("rect")
          .attr("width", 180)
          .attr("height", headerHeight)
          .attr("rx", 8)
          .attr("fill", cls.type === 'enum' ? '#312e81' : (cls.type === 'abstract' ? '#581c87' : '#1e293b'));

        g.append("text")
          .attr("x", 90)
          .attr("y", 20)
          .attr("fill", "#fff")
          .attr("font-weight", "600")
          .attr("font-size", "11px")
          .attr("text-anchor", "middle")
          .text((cls.type === 'enum' ? '«enumeration» ' : '') + cls.title);

        // Attributes
        cls.attributes.forEach((attr, idx) => {
          g.append("text")
            .attr("x", 12)
            .attr("y", headerHeight + 20 + (idx * 18))
            .attr("fill", "#cbd5e1")
            .attr("font-size", "10px")
            .attr("font-family", "monospace")
            .text(attr);
        });
      });
    }

    render('ALL');

    // Filter interaction
    document.getElementById('module-filter').addEventListener('change', (e) => {
      render(e.target.value);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(100, 50).scale(0.8));
    });

    // Initial center zoom
    svg.call(zoom.transform, d3.zoomIdentity.translate(100, 50).scale(0.8));

    // Modal logic
    const modal = document.getElementById('code-modal');
    let currentTab = 'plantuml';

    document.getElementById('btn-code').addEventListener('click', () => {
      modal.classList.remove('hidden');
      updateCodeView();
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => {
      modal.classList.add('hidden');
    });

    function updateCodeView() {
      const codeEl = document.getElementById('code-content');
      if (currentTab === 'plantuml') {
        codeEl.innerText = plantUmlSource;
        document.getElementById('tab-plantuml').className = "px-4 py-3 text-xs font-semibold text-indigo-400 border-b-2 border-indigo-500";
        document.getElementById('tab-mermaid').className = "px-4 py-3 text-xs font-semibold text-slate-400 hover:text-slate-200 border-b-2 border-transparent";
      } else {
        codeEl.innerText = mermaidSource;
        document.getElementById('tab-mermaid').className = "px-4 py-3 text-xs font-semibold text-indigo-400 border-b-2 border-indigo-500";
        document.getElementById('tab-plantuml').className = "px-4 py-3 text-xs font-semibold text-slate-400 hover:text-slate-200 border-b-2 border-transparent";
      }
    }

    document.getElementById('tab-plantuml').addEventListener('click', () => { currentTab = 'plantuml'; updateCodeView(); });
    document.getElementById('tab-mermaid').addEventListener('click', () => { currentTab = 'mermaid'; updateCodeView(); });

    document.getElementById('btn-copy').addEventListener('click', () => {
      const text = document.getElementById('code-content').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.remove('opacity-0');
        setTimeout(() => toast.classList.add('opacity-0'), 2000);
      });
    });
  </script>
</body>
</html>
