services:
  postgres:
    image: postgres:15-alpine
    container_name: catequese_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: catequese_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - catequese-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d catequese_db']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: catequese_api
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:12345678@postgres:5432/catequese_db
      FRONTEND_URLS: http://localhost:8080,http://localhost:8081,http://localhost:5173
      JWT_SECRET: docker_local_jwt_secret_change_in_prod
      JWT_REFRESH_SECRET: docker_local_refresh_secret_change_in_prod
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      S3_REGION: us-east-1
      S3_BUCKET: catequese-files
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '1000'
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: sh -c "if [ ! -x node_modules/.bin/nest ]; then npm ci; fi && npx prisma migrate deploy && npx prisma generate && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - catequese-network

  minio:
    image: minio/minio:latest
    container_name: catequese_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - catequese-network

  # Opcional: PgAdmin para gerenciar o banco
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: catequese_pgadmin
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@catequese.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    networks:
      - catequese-network
    depends_on:
      - postgres

volumes:
  postgres_data:
  minio_data:
  api_node_modules:

networks:
  catequese-network:
    driver: bridge
